[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "second-brain"
version = "0.1.0"
description = "A foundation for the Second Brain application."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic-settings>=2.10,<3"]

[project.optional-dependencies]
dev = ["mypy>=1.17,<2", "pytest>=8.4,<9", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
