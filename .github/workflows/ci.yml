name: Second Brain CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out repository
        # Reviewed release: actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        # Reviewed release: actions/setup-python v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.10

      - name: Set up Node.js
        # Reviewed release: actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0

      - name: Display runtime versions
        shell: powershell
        run: |
          python --version
          node --version
          npm --version

      - name: Install backend dependencies
        shell: powershell
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"

      - name: Run non-database backend checks
        shell: powershell
        run: .\scripts\verify.ps1 -Mode Quick -SkipDatabase

      - name: Install locked frontend dependencies
        shell: powershell
        run: .\scripts\frontend-setup.ps1

      - name: Run frontend checks
        shell: powershell
        run: .\scripts\verify-frontend.ps1

      - name: Audit frontend dependencies
        shell: powershell
        working-directory: frontend
        run: npm audit --audit-level=high
